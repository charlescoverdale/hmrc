url: https://charlescoverdale.github.io/hmrc/

template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/charlescoverdale/hmrc

reference:
  - title: Tax receipts
    desc: Monthly and annual tax revenue data
    contents:
      - hmrc_tax_receipts
      - hmrc_list_tax_heads
      - hmrc_vat
      - hmrc_corporation_tax

  - title: Duties
    desc: Monthly excise duty receipts
    contents:
      - hmrc_fuel_duties
      - hmrc_tobacco_duties

  - title: Property and stamp duty
    desc: Stamp duty receipts and property transactions
    contents:
      - hmrc_stamp_duty
      - hmrc_property_transactions

  - title: Wealth taxes
    desc: Capital Gains Tax and Inheritance Tax statistics
    contents:
      - hmrc_capital_gains
      - hmrc_inheritance_tax

  - title: Tax reliefs and incentives
    desc: R&D, Patent Box, and Creative Industries reliefs
    contents:
      - hmrc_rd_credits
      - hmrc_patent_box
      - hmrc_creative_industries

  - title: Income Tax and tax gap
    desc: Income Tax liabilities and tax gap estimates
    contents:
      - hmrc_income_tax_stats
      - hmrc_tax_gap

  - title: Discovery and provenance
    desc: Search the catalogue and inspect result metadata
    contents:
      - hmrc_search
      - hmrc_publications
      - hmrc_meta

  - title: Cache management
    desc: Inspect and clear the local cache
    contents:
      - hmrc_cache_info
      - hmrc_clear_cache

  - title: Deprecated
    desc: Renamed in v0.4.0; will be removed in v0.6.0
    contents:
      - deprecated

  - title: Package
    contents:
      - hmrc-package

  - title: Data
    desc: Bundled reference data
    contents:
      - tax_heads
      - catalogue
